{% extends "diary/base.html" %}

{% block title %}DevDiary — delete?{% endblock %}

{% block content %}
  <h2>Delete this entry?</h2>

  <p class="card">{{ entry.topic }} — {{ entry.minutes }} min</p>

  <form method="post" class="actions">
    {% csrf_token %}
    <button class="danger" type="submit">yes, delete</button>
    <a class="btn-link" href="{% url 'entry_detail' entry.pk %}">cancel</a>
  </form>
{% endblock %}
