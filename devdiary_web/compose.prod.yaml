# Production stack (chapter 39): same app as compose.yaml, but hardened for the internet —
# secrets from a server-side .env (never inline), a Caddy reverse proxy terminating TLS with
# automatic HTTPS, and restart policies so the stack survives crashes and reboots.
#   Deploy:  docker compose -f compose.prod.yaml up -d --build
#   Update:  git pull && docker compose -f compose.prod.yaml up -d --build

services:
  db:
    image: postgres:17
    env_file: .env                 # POSTGRES_DB/USER/PASSWORD from the server's git-ignored .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes Compose interpolation so the literal ${POSTGRES_USER} reaches the container shell.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped        # come back after a crash or server reboot

  web:
    build: .
    env_file: .env                 # SECRET_KEY, DEBUG=False, ALLOWED_HOSTS, DATABASE_URL,
                                   # CSRF_TRUSTED_ORIGINS — all real production values
    expose:
      - "8000"                     # reachable by Caddy on the private network; NOT host-published
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"                    # the only ports exposed to the internet
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # persists the auto-obtained Let's Encrypt certificates
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
